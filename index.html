<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Scheduling Simulator</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --secondary: #475569;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: var(--secondary);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* Slider Styling */
        .slider-container {
            margin-top: 20px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        button.algo-btn {
            padding: 10px 20px;
            background-color: white;
            color: var(--secondary);
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button.algo-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        button.algo-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-area {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        button.start-btn {
            padding: 15px 40px;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        button.start-btn:hover {
            background-color: #15803d;
            transform: translateY(-2px);
        }

        button.start-btn:active {
            transform: translateY(0);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            font-size: 1.1rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .stats span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 5px;
        }

        canvas {
            width: 100%;
            height: 400px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            margin-bottom: 10px;
        }

        .error-msg {
            color: #ef4444;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            min-height: 24px;
        }
        
        .algo-desc {
            text-align: center;
            color: var(--secondary);
            font-style: italic;
            margin-bottom: 20px;
            min-height: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Disk Scheduling Simulator</h1>
    
    <div class="card">
        <div class="controls-grid">
            <div>
                <label for="startPos">Startposition (Lesekopf) [0-200]:</label>
                <input type="number" id="startPos" placeholder="z.B. 100" min="0" max="200">
            </div>
            <div>
                <label for="queue">Anforderungen (Kommagetrennt):</label>
                <input type="text" id="queue" placeholder="z.B. 55, 58, 39, 18, 90, 160...">
            </div>
        </div>

        <div class="slider-container">
            <label for="speedRange">Animations-Geschwindigkeit:</label>
            <input type="range" id="speedRange" min="1" max="100" value="30">
        </div>

        <div class="btn-group">
            <button onclick="selectAlgo('FCFS')" id="btn-FCFS" class="algo-btn active">FCFS</button>
            <button onclick="selectAlgo('SSTF')" id="btn-SSTF" class="algo-btn">SSTF</button>
            <button onclick="selectAlgo('SCAN')" id="btn-SCAN" class="algo-btn">SCAN (Elevator)</button>
            <button onclick="selectAlgo('CSCAN')" id="btn-CSCAN" class="algo-btn">C-SCAN</button>
        </div>
        
        <div class="algo-desc" id="algo-desc">
            First Come First Serve: Die Anfragen werden strikt der Reihe nach bearbeitet.
        </div>

        <div class="action-area">
            <button onclick="startSimulation()" class="start-btn">▶ Simulation Starten</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <div class="card">
        <canvas id="diskCanvas"></canvas>
        <div class="stats">
            <div>Gesamtdistanz (Spuren)
                <span id="totalDist">-</span>
            </div>
            <div>Durchschnitt
                <span id="avgDist">-</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Globale Variablen
    let currentAlgo = 'FCFS';
    let animationId;
    
    // Canvas Setup
    const canvas = document.getElementById('diskCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth * 2;
        canvas.height = canvas.offsetHeight * 2;
        ctx.scale(2, 2);
        clearCanvas();
    }
    window.addEventListener('resize', resizeCanvas);
    
    // Beschreibungen
    const descriptions = {
        'FCFS': 'First Come First Serve: Die Anfragen werden strikt der Reihe nach bearbeitet.',
        'SSTF': 'Shortest Seek Time First: Der Kopf springt immer zur am nächsten liegenden, noch nicht bearbeiteten Anfrage.',
        'SCAN': 'SCAN: Der Kopf bewegt sich erst zur 0 (oder 200) und nimmt unterwegs alle Anfragen mit, dann kehrt er um.',
        'CSCAN': 'C-SCAN: Arbeitet nur in eine Richtung (hier nach oben). Sprung vom Ende zum Anfang zählt nicht zur Distanz.'
    };

    function selectAlgo(algo) {
        currentAlgo = algo;
        document.querySelectorAll('.algo-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${algo}`).classList.add('active');
        document.getElementById('algo-desc').innerText = descriptions[algo];
    }

    function clearCanvas() {
        const width = canvas.width / 2;
        const height = canvas.height / 2;
        const padding = 40;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Grid zeichnen
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.font = '12px Arial';
        ctx.fillStyle = '#64748b';
        
        const contentWidth = width - (padding * 2);
        const trackStep = contentWidth / 200;

        // Vertikale Linien 0, 50, 100, 150, 200
        for(let i = 0; i <= 200; i += 25) {
            let x = padding + (i * trackStep);
            ctx.beginPath();
            ctx.moveTo(x, padding);
            ctx.lineTo(x, height - padding); // Boden etwas höher
            ctx.stroke();
            ctx.fillText(i, x - 5, padding - 10);
        }

        // Text Label X-Achse
        ctx.textAlign = "center";
        ctx.fillText("Spurnummer", width/2, height - 10);
        ctx.textAlign = "left";
    }

    function startSimulation() {
        // Fehleranzeige zurücksetzen
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.innerText = "";

        // 1. Eingaben holen & Validieren
        const startInput = document.getElementById('startPos').value;
        const queueInput = document.getElementById('queue').value;

        if (startInput.trim() === "" || queueInput.trim() === "") {
            errorDiv.innerText = "Bitte Startposition und Anforderungen eingeben!";
            return;
        }

        const start = parseInt(startInput);
        const queue = queueInput.split(',')
                                .map(n => parseInt(n.trim()))
                                .filter(n => !isNaN(n)); // Leere Eingaben filtern

        if (isNaN(start) || start < 0 || start > 200) {
            errorDiv.innerText = "Startposition muss zwischen 0 und 200 liegen.";
            return;
        }
        
        if (queue.length === 0) {
            errorDiv.innerText = "Keine gültigen Spuren in der Warteschlange gefunden.";
            return;
        }

        // 2. Berechnung durchführen
        let result = { path: [], distance: 0 };
        switch(currentAlgo) {
            case 'FCFS': result = calcFCFS(start, queue); break;
            case 'SSTF': result = calcSSTF(start, queue); break;
            case 'SCAN': result = calcSCAN(start, queue); break;
            case 'CSCAN': result = calcCSCAN(start, queue); break;
        }

        // 3. Text-Ergebnisse anzeigen
        document.getElementById('totalDist').innerText = result.distance;
        document.getElementById('avgDist').innerText = (result.distance / queue.length).toFixed(2).replace('.', ',');

        // 4. Animation starten
        if (animationId) cancelAnimationFrame(animationId);
        animatePath(result.path);
    }

    // --- Algorithmen Logik ---

    function calcFCFS(start, queue) {
        let path = [start, ...queue];
        let distance = 0;
        let current = start;
        for (let q of queue) {
            distance += Math.abs(current - q);
            current = q;
        }
        return { path, distance };
    }

    function calcSSTF(start, queue) {
        let q = [...queue];
        let current = start;
        let path = [start];
        let distance = 0;

        while (q.length > 0) {
            q.sort((a, b) => Math.abs(current - a) - Math.abs(current - b));
            let next = q.shift();
            distance += Math.abs(current - next);
            path.push(next);
            current = next;
        }
        return { path, distance };
    }

    function calcSCAN(start, queue) {
        let current = start;
        let distance = 0;
        let path = [start];
        
        // Sortierung für SCAN
        let left = queue.filter(x => x < start).sort((a, b) => b - a); // Absteigend
        let right = queue.filter(x => x >= start).sort((a, b) => a - b); // Aufsteigend

        // Wir simulieren hier: Erst nach Links (Richtung 0), dann nach Rechts
        // (Wie oft in Schulbeispielen, wenn nicht anders angegeben)
        
        // 1. Links abarbeiten
        for (let x of left) {
            path.push(x);
            distance += Math.abs(current - x);
            current = x;
        }
        
        // Wenn wir links waren und noch rechts welche sind, müssen wir ggf. die 0 berühren (Umkehrpunkt)
        // Außer wir sind schon bei 0 oder es gibt keine rechts
        if (left.length > 0 || start > 0) {
             // Einfache Heuristik: Wenn wir Richtung 0 gehen, gehen wir bis zur 0 wenn nötig
             // Im strikten SCAN geht man bis zum Rand.
             if (right.length > 0) {
                if (current !== 0) {
                    distance += Math.abs(current - 0);
                    current = 0;
                    path.push(0);
                }
             }
        }

        // 2. Rechts abarbeiten
        for (let x of right) {
            path.push(x);
            distance += Math.abs(current - x);
            current = x;
        }

        return { path, distance };
    }

    function calcCSCAN(start, queue) {
        let current = start;
        let distance = 0;
        let path = [start];

        let right = queue.filter(x => x >= start).sort((a, b) => a - b);
        let left = queue.filter(x => x < start).sort((a, b) => a - b); // Auch aufsteigend sortiert

        // 1. Nach Rechts bis zum Ende
        for (let x of right) {
            path.push(x);
            distance += Math.abs(current - x);
            current = x;
        }
        
        // Bis 200 gehen (Rand)
        if (current !== 200) {
            distance += Math.abs(current - 200);
            current = 200;
            path.push(200);
        }

        // 2. Sprung nach 0 (Zählt NICHT zur Distanz)
        path.push(0);
        current = 0;

        // 3. Von 0 weiter nach oben
        for (let x of left) {
            path.push(x);
            distance += Math.abs(current - x);
            current = x;
        }

        return { path, distance };
    }

    // --- Animation ---

    function animatePath(pathPoints) {
        let progress = 0; // 0.0 bis 1.0 (über den gesamten Pfad, vereinfacht pro Segment)
        let segmentIndex = 0;
        let segmentProgress = 0;
        
        const padding = 40;
        const width = (canvas.width / 2) - (padding * 2);
        const height = (canvas.height / 2) - (padding * 2);
        const trackStep = width / 200;
        const stepY = height / (pathPoints.length - 1 || 1);

        function draw() {
            // Geschwindigkeit dynamisch auslesen
            const sliderVal = document.getElementById('speedRange').value;
            // Mapping 1-100 auf ca. 0.005 bis 0.1
            const speed = sliderVal / 1000; 

            clearCanvas();

            // Zeichne bisher abgeschlossene Segmente
            ctx.beginPath();
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 3;
            ctx.moveTo(padding + (pathPoints[0] * trackStep), padding);

            for (let i = 0; i < segmentIndex; i++) {
                let p1 = pathPoints[i];
                let p2 = pathPoints[i+1];
                
                let x1 = padding + (p1 * trackStep);
                let y1 = padding + (i * stepY);
                let x2 = padding + (p2 * trackStep);
                let y2 = padding + ((i+1) * stepY);

                // C-SCAN Sprung Check (200 -> 0)
                if (p1 === 200 && p2 === 0) {
                    ctx.stroke(); // Zeichne bisheriges
                    
                    // Gestrichelte Linie für Sprung
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(37, 99, 235, 0.3)';
                    ctx.setLineDash([5, 5]);
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    
                    // Reset für normale Linie
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.strokeStyle = '#2563eb';
                    ctx.moveTo(x2, y2);
                } else {
                    ctx.lineTo(x2, y2);
                    ctx.stroke(); // Segment sofort zeichnen damit Punkte drauf können
                    ctx.beginPath(); 
                    ctx.moveTo(x2, y2);
                }
                
                // Punkte malen (rückwirkend)
                ctx.fillStyle = '#2563eb';
                ctx.fillRect(x1 - 3, y1 - 3, 6, 6);
                // Letzter Punkt
                if (i === segmentIndex - 1) ctx.fillRect(x2 - 3, y2 - 3, 6, 6);
            }

            // Zeichne aktuelles, animiertes Segment
            if (segmentIndex < pathPoints.length - 1) {
                let pStart = pathPoints[segmentIndex];
                let pEnd = pathPoints[segmentIndex + 1];
                
                let xStart = padding + (pStart * trackStep);
                let yStart = padding + (segmentIndex * stepY);
                
                let xEnd = padding + (pEnd * trackStep);
                let yEnd = padding + ((segmentIndex + 1) * stepY);
                
                // Interpolation
                let currX = xStart + (xEnd - xStart) * segmentProgress;
                let currY = yStart + (yEnd - yStart) * segmentProgress;

                // Spezialfall C-SCAN Animation
                if (pStart === 200 && pEnd === 0) {
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(37, 99, 235, 0.3)';
                    ctx.setLineDash([5, 5]);
                    ctx.moveTo(xStart, yStart);
                    ctx.lineTo(currX, currY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else {
                    // Linie zum aktuellen Punkt ziehen (aber Startpunkt muss moveto sein)
                    // Da wir oben im Loop abgesetzt haben, müssen wir hier ansetzen
                    // Wenn Loop lief: moveTo ist am Ende von Loop.
                    // Wenn Loop 0 war: moveTo ist am Start.
                    // Das passt, da `ctx` stateful ist. Aber sicherheitshalber:
                    ctx.moveTo(xStart, yStart);
                    ctx.lineTo(currX, currY);
                    ctx.stroke();
                }

                // Head (Roter Punkt)
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(currX, currY, 6, 0, Math.PI*2);
                ctx.fill();

                // Fortschritt erhöhen
                segmentProgress += speed;
                if (segmentProgress >= 1) {
                    segmentProgress = 0;
                    segmentIndex++;
                }
                
                animationId = requestAnimationFrame(draw);
            } else {
                // Ende erreicht, sicherstellen dass alles gezeichnet ist
                // (Der Loop oben zeichnet bis segmentIndex, also alles gut)
            }
        }

        resizeCanvas(); // Initiale Bereinigung
        draw();
    }
    
    // Initial Setup
    resizeCanvas();
</script>
</body>
</html>
